[project]
name = "scout-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "statsbombpy",
    "pandas",
    "numpy",
    "psycopg[binary]",
    "socceraction>=1.5.3",
    "multimethod<2",
    "anthropic>=2.12.0",
]

[dependency-groups]
dev = [
    "kloppy>=3.19.1",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
