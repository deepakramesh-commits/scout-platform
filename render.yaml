# Render blueprint: one Docker web service (web app + job worker sharing a disk) and one Postgres database.
# Frankfurt sits between the European buyers and the African clubs.
services:
  - type: web
    name: scout
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # a persistent disk needs a paid instance
    region: frankfurt
    healthCheckPath: /login
    preDeployCommand: /app/scripts/migrate.sh
    disk:
      name: storage
      mountPath: /var/data # STORAGE_DIR: uploaded video, ID documents, exports
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Optional. Left empty, video stays on the disk and summaries use the template.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: MUX_SIGNING_KEY_ID
        sync: false
      - key: MUX_SIGNING_KEY_PRIVATE
        sync: false

databases:
  - name: scout-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
