# Render blueprint, free plan: one Docker web service (web app + job worker) and one Postgres database.
# Frankfurt sits between the European buyers and the African clubs.
#
# Free-plan limits that matter here:
# - No disk: uploaded video, ID documents and exports are lost on every restart or spin-down.
# - The service sleeps after 15 idle minutes (the worker with it); the first visit after takes about a minute.
# - 512 MB memory: publishing a match recomputes its whole competition, which needs about 700 MB for AFCON 2023.
# - The free database is deleted 30 days after creation (plus a 14-day grace period to upgrade).
# To go paid: set plan: starter, add the disk block below, and set the database plan to basic-256mb.
#   disk:
#     name: storage
#     mountPath: /var/data
#     sizeGB: 10
services:
  - type: web
    name: scout
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Optional. Left empty, video stays on local storage and summaries use the template.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MUX_TOKEN_ID
        sync: false
      - key: MUX_TOKEN_SECRET
        sync: false
      - key: MUX_WEBHOOK_SECRET
        sync: false
      - key: MUX_SIGNING_KEY_ID
        sync: false
      - key: MUX_SIGNING_KEY_PRIVATE
        sync: false

databases:
  - name: scout-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
